name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # We use a two-phase release workflow:
  # 1. create-draft: Validate version, run license checks, and create a single draft release on GitHub.
  # 2. build: Matrix build on Windows and Linux, uploading artifacts to the pre-created draft release.
  #
  # Why:
  # - When a Release does not exist yet, tauri-action v1 fails without `releaseName`.
  # - If multiple matrix jobs attempt to create a draft release concurrently, duplicate draft releases can be created.
  # Pre-creating the draft release with the GitHub CLI ensures a single draft release exists,
  # allowing subsequent matrix jobs to find and upload artifacts to it.
  create-draft:
    name: Create Draft Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Verify version matches tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG_NAME;
            if (!tag || !tag.startsWith("v")) {
              console.error(`Tag "${tag}" does not start with "v"`);
              process.exit(1);
            }
            const tagWithoutV = tag.slice(1);
            const baseTagVersion = tagWithoutV.split("-")[0];

            const pkgVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;

            const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            const cargoMatch = cargoToml.match(/\[package\][\s\S]*?version\s*=\s*"([^"]+)"/);
            if (!cargoMatch) {
              console.error("Could not find version in src-tauri/Cargo.toml");
              process.exit(1);
            }
            const cargoVersion = cargoMatch[1];

            console.log(`Tag: ${tag} (base: ${baseTagVersion})`);
            console.log(`package.json: ${pkgVersion}`);
            console.log(`src-tauri/tauri.conf.json: ${tauriVersion}`);
            console.log(`src-tauri/Cargo.toml: ${cargoVersion}`);

            let mismatch = false;
            if (pkgVersion !== baseTagVersion) {
              console.error(`Mismatch: package.json version (${pkgVersion}) != tag version (${baseTagVersion})`);
              mismatch = true;
            }
            if (tauriVersion !== baseTagVersion) {
              console.error(`Mismatch: src-tauri/tauri.conf.json version (${tauriVersion}) != tag version (${baseTagVersion})`);
              mismatch = true;
            }
            if (cargoVersion !== baseTagVersion) {
              console.error(`Mismatch: src-tauri/Cargo.toml version (${cargoVersion}) != tag version (${baseTagVersion})`);
              mismatch = true;
            }
            if (mismatch) {
              process.exit(1);
            }
            console.log("Version verification successful.");
          '

      - name: Install license tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: License Check
        run: npm run licenses:check

      # A release must not ship a dependency with a known vulnerability, even if
      # the weekly audit has not run since the advisory was published.
      - name: Advisory Check
        run: |
          cargo deny check advisories
          npm audit --omit=dev

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          extra_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "SVG Tracer $GITHUB_REF_NAME" \
            --verify-tag \
            "${extra_args[@]}"

  build:
    name: Build (${{ matrix.os }})
    needs: create-draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux builds use ubuntu-22.04 because binaries cannot run on a system
        # with an older glibc than the build environment. The application requirements
        # specify Ubuntu 22.04 or later as the target environment.
        os: [windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: false
