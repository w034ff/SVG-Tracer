name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Code Format Check
        run: npm run format:check

      - name: Frontend Lint
        run: npm run lint

      - name: Frontend Typecheck
        run: npm run typecheck

      - name: Frontend Test
        run: npm test

      - name: Rust Format Check
        run: cargo fmt --check

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust Test
        run: cargo test --workspace --locked

      - name: Check TypeScript bindings diff
        shell: bash
        run: |
          status=$(git status --porcelain src/ipc/generated)
          if [ -n "$status" ]; then
            echo "Unexpected changes in src/ipc/generated:"
            echo "$status"
            exit 1
          fi

      - name: Rust Test (Release Performance)
        run: cargo test -p tracer --release --locked --test quality test_1024x1024_conversion_time

      # Both checks pin their target platforms (deny.toml, about.toml), so the
      # result does not depend on the runner OS and one runner is enough.
      - name: Install license tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: License Check
        if: runner.os == 'Linux'
        run: npm run licenses:check

      - name: Check third-party license list is current
        if: runner.os == 'Linux'
        run: |
          npm run licenses:generate
          status=$(git status --porcelain src/licenses)
          if [ -n "$status" ]; then
            echo "src/licenses/third-party-licenses.json is out of date. Run npm run licenses:generate and commit the result."
            echo "$status"
            exit 1
          fi
