<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Single conversion (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:"Segoe UI","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:13px;color:#ECEBE7;background:#161719}
a{color:#7EB0F0}a:hover{color:#A6C9F5}
.btn{height:32px;padding:0 14px;border-radius:6px;border:1px solid #3F4247;background:#26282C;color:#ECEBE7;font:inherit;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-sizing:border-box}
.btn-primary{background:#7EB0F0;border-color:#7EB0F0;color:#0D1B2E}
.icon-btn{width:32px;padding:0;justify-content:center}
.seg{display:flex;border:1px solid #3F4247;border-radius:6px;overflow:hidden}
.seg button{flex:1;height:30px;border:0;background:#26282C;font:inherit;color:#ECEBE7}
.seg button[aria-pressed="true"]{background:#7EB0F0;color:#0D1B2E;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px}
.field-head{display:flex;justify-content:space-between;font-weight:600}
.val{font-family:"Cascadia Mono",ui-monospace,monospace;color:#A8A6A0}
input[type=range]{width:100%;accent-color:#7EB0F0;margin:0}
select{height:32px;border:1px solid #3F4247;border-radius:6px;background:#26282C;font:inherit;padding:0 8px;color:#ECEBE7}
.tab{height:48px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:transparent;font:inherit;font-weight:600;color:#A8A6A0}
.tab[aria-selected="true"]{color:#ECEBE7;border-bottom-color:#7EB0F0}
.checker{background-color:#232427;background-image:linear-gradient(45deg,#2C2E32 25%,transparent 25%),linear-gradient(-45deg,#2C2E32 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2C2E32 75%),linear-gradient(-45deg,transparent 75%,#2C2E32 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
</style>
</helmet>
<div style="width: 1200px; height: 800px; display: flex; flex-direction: column; background: #161719; overflow: hidden">
<header style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 16px; background: #1F2023; border-bottom: 1px solid #34363B; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7EB0F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20c4-12 12-12 16-16"></path><circle cx="4" cy="20" r="2"></circle><circle cx="20" cy="4" r="2"></circle></svg>
<span>SVG Tracer</span>
</div>
<nav role="tablist" aria-label="Mode" style="display: flex; align-self: stretch">
<button class="tab" role="tab" aria-selected="true">Single</button>
<button class="tab" role="tab" aria-selected="false">Batch</button>
</nav>
<div style="flex-grow: 1"></div>
<select aria-label="Language"><option>English</option><option>日本語</option></select>
<button class="btn icon-btn" aria-label="About"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg></button>
</header>
<div style="flex-grow: 1; display: flex; min-height: 0">
<aside style="width: 300px; flex-shrink: 0; box-sizing: border-box; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; background: #1F2023; border-right: 1px solid #34363B; overflow-y: auto">
<div class="field"><label for="preset" class="field-head">Preset</label><select id="preset"><option>Custom</option><option>Logo (color)</option><option>Illustration (fewer colors)</option><option>Black &amp; white</option></select></div>
<div style="height: 1px; background: #34363B"></div>
<div class="field"><span class="field-head">Color</span><div class="seg"><button aria-pressed="true">Color</button><button aria-pressed="false">Black &amp; white</button></div></div>
<div class="field"><label for="cp" class="field-head"><span>Color precision</span><span class="val">6</span></label><input id="cp" type="range" min="1" max="8" value="6"></div>
<div class="field"><label for="fs" class="field-head"><span>Remove specks</span><span class="val">4</span></label><input id="fs" type="range" min="0" max="16" value="4"></div>
<div class="field"><label for="ct" class="field-head"><span>Corner threshold</span><span class="val">90°</span></label><input id="ct" type="range" min="0" max="180" value="90"></div>
<div class="field"><span class="field-head">Curve type</span><div class="seg"><button aria-pressed="true">Curves</button><button aria-pressed="false">Polygons</button></div></div>
<button class="btn" aria-expanded="true" style="width: 100%; justify-content: space-between">Advanced<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<div class="field"><label for="ld" class="field-head"><span>Color separation</span><span class="val">16</span></label><input id="ld" type="range" min="0" max="128" value="16"></div>
<div class="field"><span class="field-head">Layering</span><div class="seg"><button aria-pressed="true">Stacked</button><button aria-pressed="false">Cutout</button></div></div>
<div class="field"><label for="lt" class="field-head"><span>Min. segment length</span><span class="val">4.0</span></label><input id="lt" type="range" min="3.5" max="10" step="0.5" value="4"></div>
<div class="field"><label for="st" class="field-head"><span>Curve splitting</span><span class="val">45°</span></label><input id="st" type="range" min="0" max="180" value="45"></div>
<div class="field"><label for="pp" class="field-head"><span>Path precision</span><span class="val">2</span></label><input id="pp" type="range" min="0" max="8" value="2"></div>
</aside>
<main style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #1B1C1F; border-bottom: 1px solid #34363B">
<span style="font-weight: 600">logo_color.png</span>
<span class="val">1024 × 1024 · PNG</span>
<div style="flex-grow: 1"></div>
<button class="btn icon-btn" aria-label="Zoom out"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span class="val" style="width: 44px; text-align: center">35%</span>
<button class="btn icon-btn" aria-label="Zoom in"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
<button class="btn">Fit</button>
<button class="btn">100%</button>
</div>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #34363B; min-height: 0">
<section style="display: flex; flex-direction: column; background: #1B1C1F; min-height: 0">
<div style="height: 32px; display: flex; align-items: center; padding: 0 12px; font-weight: 600; color: #A8A6A0">Original</div>
<div class="checker" style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<svg width="340" height="340" viewBox="0 0 200 200" aria-label="Original preview"><rect x="20" y="20" width="160" height="160" rx="36" fill="#1F5FAD"></rect><circle cx="100" cy="92" r="44" fill="#F2A541"></circle><path d="M60 160L100 110L140 160Z" fill="#E4572E"></path><circle cx="148" cy="52" r="14" fill="#2E9E6B"></circle></svg>
</div>
</section>
<section style="display: flex; flex-direction: column; background: #1B1C1F; min-height: 0">
<div style="height: 32px; display: flex; align-items: center; padding: 0 12px; font-weight: 600; color: #A8A6A0">SVG</div>
<div class="checker" style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<svg width="340" height="340" viewBox="0 0 200 200" aria-label="SVG preview"><rect x="20" y="20" width="160" height="160" rx="36" fill="#1F5FAD"></rect><circle cx="100" cy="92" r="44" fill="#F2A541"></circle><path d="M60 160L100 110L140 160Z" fill="#E4572E"></path><circle cx="148" cy="52" r="14" fill="#2E9E6B"></circle></svg>
</div>
</section>
</div>
<footer style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 20px; padding: 0 16px; background: #1F2023; border-top: 1px solid #34363B">
<span>Paths <span class="val" style="color: #ECEBE7">41</span></span>
<span>Size <span class="val" style="color: #ECEBE7">13.1 KB</span></span>
<span>Time <span class="val" style="color: #ECEBE7">0.45 s</span></span>
<div style="flex-grow: 1"></div>
<button class="btn">Open image</button>
<button class="btn btn-primary">Save SVG</button>
</footer>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
