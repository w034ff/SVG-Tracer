<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>単体変換（画像未選択）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:"Segoe UI","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:13px;color:#1C1B19;background:#F4F3F0}
a{color:#1F5FAD}a:hover{color:#174A87}
.btn{height:32px;padding:0 14px;border-radius:6px;border:1px solid #CFCCC4;background:#FFFFFF;color:#1C1B19;font:inherit;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-sizing:border-box}
.btn-primary{background:#1F5FAD;border-color:#1F5FAD;color:#FFFFFF}
.btn[disabled]{opacity:.45}
.icon-btn{width:32px;padding:0;justify-content:center}
.seg{display:flex;border:1px solid #CFCCC4;border-radius:6px;overflow:hidden}
.seg button{flex:1;height:30px;border:0;background:#FFFFFF;font:inherit;color:#1C1B19}
.seg button[aria-pressed="true"]{background:#1F5FAD;color:#FFFFFF;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px}
.field-head{display:flex;justify-content:space-between;font-weight:600}
.val{font-family:"Cascadia Mono",ui-monospace,monospace;color:#5E5B55}
input[type=range]{width:100%;accent-color:#1F5FAD;margin:0}
select{height:32px;border:1px solid #CFCCC4;border-radius:6px;background:#FFFFFF;font:inherit;padding:0 8px;color:#1C1B19}
.tab{height:48px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:transparent;font:inherit;font-weight:600;color:#5E5B55}
.tab[aria-selected="true"]{color:#1C1B19;border-bottom-color:#1F5FAD}
</style>
</helmet>
<div style="width: 1200px; height: 800px; display: flex; flex-direction: column; background: #F4F3F0; overflow: hidden">
<header style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #DAD8D2; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F5FAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20c4-12 12-12 16-16"></path><circle cx="4" cy="20" r="2"></circle><circle cx="20" cy="4" r="2"></circle></svg>
<span>SVG Tracer</span>
</div>
<nav role="tablist" aria-label="モード" style="display: flex; align-self: stretch">
<button class="tab" role="tab" aria-selected="true">単体変換</button>
<button class="tab" role="tab" aria-selected="false">一括変換</button>
</nav>
<div style="flex-grow: 1"></div>
<select aria-label="言語"><option>日本語</option><option>English</option></select>
<button class="btn icon-btn" aria-label="このアプリについて"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg></button>
</header>
<div style="flex-grow: 1; display: flex; min-height: 0">
<aside style="width: 300px; flex-shrink: 0; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 18px; background: #FFFFFF; border-right: 1px solid #DAD8D2">
<div class="field"><label for="preset" class="field-head">プリセット</label><select id="preset"><option>ロゴ（カラー）</option><option>イラスト（色数少なめ）</option><option>白黒</option><option>カスタム</option></select></div>
<div style="height: 1px; background: #E6E4DF"></div>
<div class="field"><span class="field-head">色</span><div class="seg"><button aria-pressed="true">カラー</button><button aria-pressed="false">白黒</button></div></div>
<div class="field"><label for="cp" class="field-head"><span>色の精度</span><span class="val">6</span></label><input id="cp" type="range" min="1" max="8" value="6"></div>
<div class="field"><label for="fs" class="field-head"><span>ノイズ除去</span><span class="val">4</span></label><input id="fs" type="range" min="0" max="16" value="4"></div>
<div class="field"><label for="ct" class="field-head"><span>角の判定</span><span class="val">60°</span></label><input id="ct" type="range" min="0" max="180" value="60"></div>
<div class="field"><span class="field-head">線の種類</span><div class="seg"><button aria-pressed="true">曲線</button><button aria-pressed="false">多角形</button></div></div>
<button class="btn" aria-expanded="false" style="width: 100%; justify-content: space-between">詳細設定<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</aside>
<main style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<div style="flex-grow: 1; padding: 24px; display: flex; min-height: 0">
<div style="flex-grow: 1; border: 2px dashed #B9B5AB; border-radius: 12px; background: #FAF9F7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#5E5B55" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>
<div style="font-size: 18px; font-weight: 700">画像をここにドロップ</div>
<div style="color: #5E5B55">PNG / JPEG / WebP / BMP / GIF に対応</div>
<button class="btn btn-primary" style="margin-top: 8px">画像を開く</button>
</div>
</div>
<footer style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 20px; padding: 0 16px; background: #FFFFFF; border-top: 1px solid #DAD8D2">
<span style="color: #5E5B55">画像が選択されていません</span>
<div style="flex-grow: 1"></div>
<button class="btn btn-primary" disabled>SVG を保存</button>
</footer>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
