[package]
name = "svg-tracer"
version = "0.1.0"
description = "Vectorize bitmap images to clean SVG"
authors = ["w034ff"]
edition = "2024"

[lib]
name = "svg_tracer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tracer = { path = "../crates/tracer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "10"
tempfile = "3"

